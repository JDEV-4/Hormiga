name: hormiga
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.5.0
  shared_preferences: ^2.1.1
  flutter_secure_storage: ^9.2.2

  # Reproductores multimedia
  video_player: ^2.5.0
  chewie: ^1.4.0
  youtube_player_flutter: ^9.1.3
  flutter_inappwebview: ^6.0.0


  # UI y utilidades
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  image_picker: ^1.0.4
  geolocator: ^14.0.2
  geocoding: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/avatar.png
    - assets/icons/fire.png
    - assets/icons/water.png
    - assets/img/Saludando.png
    - assets/img/Acertado.png
    - assets/img/Asustado.png
    - assets/img/logo.png
    - assets/lessons.json
    - assets/img/incendios.png
    - assets/img/deslave.png
    - assets/img/sismos.png
    - assets/img/huracanes.png
